server:
  port: 8088

spring:
  application:
    name: catalogo-service
  datasource:
    url: jdbc:h2:mem:catalogo-db
    username: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    host: localhost
    port: 5672

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/