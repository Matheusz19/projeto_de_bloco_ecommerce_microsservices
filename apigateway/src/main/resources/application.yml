server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
      routes:
        - id: catalogo-service
          uri: lb://CATALOGO-SERVICE
          predicates:
            - Path=/api/produtos/**

        - id: pagamento-service
          uri: lb://PAGAMENTO-SERVICE
          predicates:
            - Path=/api/pagamentos/**

        - id: pedido-service-carrinhos
          uri: lb://PEDIDO-SERVICE
          predicates:
            - Path=/api/carrinhos/**

        - id: pedido-service-pedidos
          uri: lb://PEDIDO-SERVICE
          predicates:
            - Path=/api/pedidos/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/