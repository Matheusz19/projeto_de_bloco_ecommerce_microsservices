server:
  port: 8081
spring:
  application:
    name: pagamento-service
  datasource:
    url: jdbc:h2:mem:pagamento-db
    username: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    host: localhost
    port: 5672
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/